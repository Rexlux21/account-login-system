<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crypto Price Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1b1b2f;
      color: #fff;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #f39c12;
    }

    .crypto-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
    }

    .crypto-card {
      background: #2c2c54;
      padding: 20px;
      border-radius: 10px;
      width: 200px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .crypto-card h2 {
      margin: 10px 0;
    }

    .price-up {
      color: #2ecc71;
    }

    .price-down {
      color: #e74c3c;
    }
  </style>
</head>
<body>

  <h1>💹 Crypto Price Tracker</h1>

  <div class="crypto-container" id="cryptoContainer"></div>

  <script>
    const cryptoContainer = document.getElementById("cryptoContainer");

    const cryptoIds = ["bitcoin", "ethereum", "dogecoin"];

    function fetchCrypto() {
      fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${cryptoIds.join(',')}`)
        .then(res => res.json())
        .then(data => {
          cryptoContainer.innerHTML = ""; // clear previous

          data.forEach(coin => {
            const card = document.createElement("div");
            card.className = "crypto-card";

            const priceClass = coin.price_change_percentage_24h >= 0 ? "price-up" : "price-down";

            card.innerHTML = `
              <h2>${coin.name} (${coin.symbol.toUpperCase()})</h2>
              <p><strong>Price:</strong> $${coin.current_price.toLocaleString()}</p>
              <p class="${priceClass}"><strong>24h Change:</strong> ${coin.price_change_percentage_24h.toFixed(2)}%</p>
            `;

            cryptoContainer.appendChild(card);
          });
        })
        .catch(err => {
          cryptoContainer.innerHTML = "<p>Error fetching crypto data 😢</p>";
          console.error(err);
        });
    }

    // Fetch initially
    fetchCrypto();

    // Refresh every 10 seconds
    setInterval(fetchCrypto, 10000);
  </script>

</body>
</html>
